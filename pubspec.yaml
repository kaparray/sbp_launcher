name: sbp_launcher
description: "Flutter plugin for SBP payments: detects installed bank apps by their SBP scheme, loads the NSPK bank registry and opens qr.nspk.ru links."
version: 1.0.1
homepage: https://github.com/kaparray/sbp_launcher
repository: https://github.com/kaparray/sbp_launcher
issue_tracker: https://github.com/kaparray/sbp_launcher/issues
topics:
  - sbp
  - payments
  - nspk
  - banking

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.github.kaparray.sbp_launcher
        pluginClass: SbpLauncherPlugin
      ios:
        pluginClass: SbpLauncherPlugin
